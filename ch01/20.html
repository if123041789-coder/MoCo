<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園尋友通</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f0f0;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .section-title {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .info-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }

        .info-row {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .label {
            color: #666;
            font-weight: bold;
        }

        .value {
            color: #333;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 80px;
            resize: vertical;
            font-family: monospace;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #f0f0f0;
            border: none;
            font-size: 16px;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #4CAF50;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .distance-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
        }

        .distance-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }

        .direction-arrow {
            font-size: 48px;
            margin: 10px 0;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>📍 校園尋友通</h1>
    <p class="subtitle">簡易定位分享系統</p>

    <div class="tabs">
        <button class="tab active" onclick="showTab('myLocation')">我的位置</button>
        <button class="tab" onclick="showTab('findFriend')">找朋友</button>
        <button class="tab" onclick="showTab('message')">傳訊息</button>
    </div>

    <!-- 頁面 1: 我的位置 -->
    <div id="myLocation" class="tab-content active">
        <div class="container">
            <div class="section-title">📱 我的位置資訊</div>
            
            <div id="statusMessage"></div>

            <div class="info-box">
                <div class="info-row">
                    <span class="label">緯度 (Latitude):</span>
                    <span class="value" id="myLat">--</span>
                </div>
                <div class="info-row">
                    <span class="label">經度 (Longitude):</span>
                    <span class="value" id="myLng">--</span>
                </div>
                <div class="info-row">
                    <span class="label">精確度:</span>
                    <span class="value" id="myAccuracy">--</span>
                </div>
                <div class="info-row">
                    <span class="label">更新時間:</span>
                    <span class="value" id="updateTime">--</span>
                </div>
            </div>

            <button onclick="getMyLocation()">🔄 更新我的位置</button>

            <div class="section-title" style="margin-top: 20px;">📤 分享位置給好友</div>
            
            <label>你的名字:</label>
            <input type="text" id="myName" placeholder="例如: 小明" value="我">

            <button onclick="generateShareCode()">產生分享碼</button>

            <label>分享碼 (複製後傳給好友):</label>
            <textarea id="shareCode" readonly placeholder="按上面的按鈕產生分享碼"></textarea>
            <p class="help-text">💡 複製上面的文字，用 LINE 或其他方式傳給好友</p>

            <button onclick="copyShareCode()">📋 複製分享碼</button>
        </div>
    </div>

    <!-- 頁面 2: 找朋友 -->
    <div id="findFriend" class="tab-content">
        <div class="container">
            <div class="section-title">🔍 尋找好友位置</div>

            <label>貼上好友的分享碼:</label>
            <textarea id="friendCode" placeholder="把好友傳來的分享碼貼在這裡"></textarea>

            <button onclick="loadFriendLocation()">🗺️ 顯示好友位置</button>

            <div id="friendInfo"></div>

            <div id="distanceInfo"></div>
        </div>
    </div>

    <!-- 頁面 3: 傳訊息 -->
    <div id="message" class="tab-content">
        <div class="container">
            <div class="section-title">💬 簡易訊息</div>

            <label>輸入訊息:</label>
            <input type="text" id="messageInput" placeholder="例如: 我到了，你在哪？">

            <button onclick="generateMessageCode()">產生訊息碼</button>

            <label>訊息碼 (複製後傳給好友):</label>
            <textarea id="messageCode" readonly placeholder="按上面的按鈕產生訊息碼"></textarea>

            <button onclick="copyMessageCode()">📋 複製訊息碼</button>

            <div class="section-title" style="margin-top: 30px;">📥 讀取好友訊息</div>

            <label>貼上好友的訊息碼:</label>
            <textarea id="receivedCode" placeholder="把好友傳來的訊息碼貼在這裡"></textarea>

            <button onclick="decodeMessage()">📖 讀取訊息</button>

            <div id="receivedMessage"></div>
        </div>
    </div>

    <script>
        // 全域變數：儲存我的位置
        var myCurrentLat = null;
        var myCurrentLng = null;
        var friendLat = null;
        var friendLng = null;

        // 功能 1: 取得我的位置
        function getMyLocation() {
            // 顯示載入訊息
            showMessage('statusMessage', '正在取得位置...', 'warning');

            // 檢查瀏覽器是否支援定位
            if (!navigator.geolocation) {
                showMessage('statusMessage', '您的裝置不支援定位功能', 'error');
                return;
            }

            // 呼叫 GPS 定位 API
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // 成功取得位置
                    myCurrentLat = position.coords.latitude;
                    myCurrentLng = position.coords.longitude;
                    var accuracy = position.coords.accuracy;

                    // 顯示在畫面上
                    document.getElementById('myLat').textContent = myCurrentLat.toFixed(6);
                    document.getElementById('myLng').textContent = myCurrentLng.toFixed(6);
                    document.getElementById('myAccuracy').textContent = accuracy.toFixed(0) + ' 公尺';
                    
                    // 顯示時間
                    var now = new Date();
                    var timeString = now.getHours() + ':' + 
                                   (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                    document.getElementById('updateTime').textContent = timeString;

                    showMessage('statusMessage', '✅ 位置更新成功！', 'success');
                },
                function(error) {
                    // 失敗處理
                    var errorMsg = '';
                    if (error.code == 1) {
                        errorMsg = '請允許網頁使用定位功能';
                    } else if (error.code == 2) {
                        errorMsg = '無法取得位置，請檢查 GPS 是否開啟';
                    } else {
                        errorMsg = '定位請求逾時，請重試';
                    }
                    showMessage('statusMessage', '❌ ' + errorMsg, 'error');
                },
                {
                    enableHighAccuracy: true,  // 使用高精確度
                    timeout: 10000,            // 10秒逾時
                    maximumAge: 0              // 不使用快取
                }
            );
        }

        // 功能 2: 產生分享碼
        function generateShareCode() {
            // 檢查是否有位置資料
            if (myCurrentLat == null || myCurrentLng == null) {
                alert('請先按「更新我的位置」取得座標');
                return;
            }

            // 取得名字
            var name = document.getElementById('myName').value.trim();
            if (name == '') {
                name = '朋友';
            }

            // 建立資料物件
            var data = {
                name: name,
                lat: myCurrentLat,
                lng: myCurrentLng,
                time: Date.now()  // 時間戳記
            };

            // 轉換成 JSON 字串
            var jsonString = JSON.stringify(data);
            
            // 編碼成 Base64（方便複製貼上）
            var encoded = btoa(unescape(encodeURIComponent(jsonString)));

            // 顯示在文字框
            document.getElementById('shareCode').value = encoded;
        }

        // 功能 3: 複製分享碼
        function copyShareCode() {
            var code = document.getElementById('shareCode').value;
            if (code == '') {
                alert('請先產生分享碼');
                return;
            }

            // 複製到剪貼簿
            navigator.clipboard.writeText(code).then(function() {
                alert('✅ 已複製！現在可以傳給朋友了');
            });
        }

        // 功能 4: 讀取好友位置
        function loadFriendLocation() {
            var code = document.getElementById('friendCode').value.trim();
            
            if (code == '') {
                alert('請貼上好友的分享碼');
                return;
            }

            try {
                // 解碼 Base64
                var decoded = decodeURIComponent(escape(atob(code)));
                var data = JSON.parse(decoded);

                friendLat = data.lat;
                friendLng = data.lng;

                // 顯示好友資訊
                var timeAgo = Math.floor((Date.now() - data.time) / 1000 / 60);
                var html = '<div class="info-box">' +
                          '<div class="info-row">' +
                          '<span class="label">好友名稱:</span>' +
                          '<span class="value">' + data.name + '</span>' +
                          '</div>' +
                          '<div class="info-row">' +
                          '<span class="label">緯度:</span>' +
                          '<span class="value">' + data.lat.toFixed(6) + '</span>' +
                          '</div>' +
                          '<div class="info-row">' +
                          '<span class="label">經度:</span>' +
                          '<span class="value">' + data.lng.toFixed(6) + '</span>' +
                          '</div>' +
                          '<div class="info-row">' +
                          '<span class="label">更新時間:</span>' +
                          '<span class="value">' + timeAgo + ' 分鐘前</span>' +
                          '</div>' +
                          '</div>';

                document.getElementById('friendInfo').innerHTML = html;

                // 計算距離
                calculateDistance();

            } catch (e) {
                alert('❌ 分享碼格式錯誤，請重新貼上');
            }
        }

        // 功能 5: 計算距離（Haversine 公式）
        function calculateDistance() {
            // 需要兩邊的座標
            if (myCurrentLat == null || friendLat == null) {
                document.getElementById('distanceInfo').innerHTML = 
                    '<div class="message warning">請先更新你的位置</div>';
                return;
            }

            // 地球半徑（公里）
            var R = 6371;

            // 轉換成弧度
            var lat1 = myCurrentLat * Math.PI / 180;
            var lat2 = friendLat * Math.PI / 180;
            var dLat = (friendLat - myCurrentLat) * Math.PI / 180;
            var dLng = (friendLng - myCurrentLng) * Math.PI / 180;

            // Haversine 公式
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1) * Math.cos(lat2) *
                    Math.sin(dLng/2) * Math.sin(dLng/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            var distance = R * c;

            // 計算方向角
            var y = Math.sin(dLng) * Math.cos(lat2);
            var x = Math.cos(lat1) * Math.sin(lat2) -
                    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
            var bearing = Math.atan2(y, x) * 180 / Math.PI;
            bearing = (bearing + 360) % 360;

            // 方向文字
            var directions = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
            var index = Math.round(bearing / 45) % 8;
            var directionText = directions[index];

            // 方向箭頭
            var arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
            var arrow = arrows[index];

            // 距離文字
            var distanceText = '';
            if (distance < 1) {
                distanceText = (distance * 1000).toFixed(0) + ' 公尺';
            } else {
                distanceText = distance.toFixed(2) + ' 公里';
            }

            // 顯示結果
            var html = '<div class="distance-display">' +
                      '<div>好友在你的</div>' +
                      '<div class="direction-arrow">' + arrow + '</div>' +
                      '<div style="font-size: 24px; font-weight: bold;">' + directionText + '</div>' +
                      '<div style="margin-top: 15px;">距離</div>' +
                      '<div class="distance-value">' + distanceText + '</div>' +
                      '</div>';

            document.getElementById('distanceInfo').innerHTML = html;
        }

        // 功能 6: 產生訊息碼
        function generateMessageCode() {
            var message = document.getElementById('messageInput').value.trim();
            
            if (message == '') {
                alert('請輸入訊息');
                return;
            }

            var data = {
                msg: message,
                time: Date.now()
            };

            var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            document.getElementById('messageCode').value = encoded;
        }

        // 功能 7: 複製訊息碼
        function copyMessageCode() {
            var code = document.getElementById('messageCode').value;
            if (code == '') {
                alert('請先產生訊息碼');
                return;
            }

            navigator.clipboard.writeText(code).then(function() {
                alert('✅ 已複製訊息碼');
            });
        }

        // 功能 8: 解碼訊息
        function decodeMessage() {
            var code = document.getElementById('receivedCode').value.trim();
            
            if (code == '') {
                alert('請貼上訊息碼');
                return;
            }

            try {
                var decoded = decodeURIComponent(escape(atob(code)));
                var data = JSON.parse(decoded);

                var time = new Date(data.time);
                var timeString = time.getHours() + ':' + 
                               (time.getMinutes() < 10 ? '0' : '') + time.getMinutes();

                var html = '<div class="info-box">' +
                          '<div style="font-weight: bold; margin-bottom: 10px;">收到的訊息：</div>' +
                          '<div style="font-size: 16px; padding: 10px; background: white; border-radius: 5px;">' +
                          data.msg +
                          '</div>' +
                          '<div style="margin-top: 10px; font-size: 12px; color: #999;">時間: ' + 
                          timeString + '</div>' +
                          '</div>';

                document.getElementById('receivedMessage').innerHTML = html;

            } catch (e) {
                alert('❌ 訊息碼格式錯誤');
            }
        }

        // 輔助功能: 顯示訊息
        function showMessage(elementId, text, type) {
            var html = '<div class="message ' + type + '">' + text + '</div>';
            document.getElementById(elementId).innerHTML = html;
        }

        // 輔助功能: 切換分頁
        function showTab(tabName) {
            // 隱藏所有分頁
            var contents = document.getElementsByClassName('tab-content');
            for (var i = 0; i < contents.length; i++) {
                contents[i].classList.remove('active');
            }

            // 移除所有 tab 的 active
            var tabs = document.getElementsByClassName('tab');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }

            // 顯示選中的分頁
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // 頁面載入時提示
        window.onload = function() {
            showMessage('statusMessage', '👆 請先按「更新我的位置」開始使用', 'warning');
        };
    </script>
</body>
</html>
